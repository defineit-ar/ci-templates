# Dispara un deploy en Vercel vía Deploy Hook.
#
# ## Por qué un hook y no la integración nativa de git
#
# Vercel decide si un push deploya según el rol que tenga en el team quien
# pusheó. En un team donde la mayoría es `Viewer` —subir a `Developer` cuesta
# por seat— eso significa que el deploy sale o no sale según quién programó.
# El Deploy Hook es una URL: no le importa quién la llama, y la llama el
# runner, siempre con la misma identidad.
#
# ## Qué gatea el deploy, exactamente
#
# El gate es el TRIGGER del workflow llamador, no este archivo. La forma
# prevista de usarlo es que el repo llamador lo invoque desde un workflow con
# `on: workflow_dispatch`: entonces el deploy no ocurre al pushear, ocurre
# cuando una persona aprieta "Run workflow".
#
# Eso da **disparo manual**, que NO es lo mismo que **aprobación de un segundo
# par de ojos**: quien dispara puede ser la misma persona que escribió el
# código. La aprobación real serían "Required reviewers" en un GitHub
# Environment, que en repos privados requiere plan pago. Es una limitación
# asumida, no un olvido.
#
# El `environment:` de abajo, entonces, no está gateando nada mientras el
# Environment no tenga protection rules: está para que el deploy quede
# registrado en el historial de deployments del repo. Si algún día hay plan
# pago, agregarle reviewers a ese Environment convierte esto en aprobación
# real sin tocar el workflow.

name: Vercel deploy hook

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment donde se registra el deploy (ej. staging, production). Si tiene protection rules configuradas, además lo gatea."
        required: true
        type: string
    secrets:
      deploy_hook_url:
        description: "URL del Vercel Deploy Hook para ese branch/environment"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Un deploy por environment a la vez. `cancel-in-progress: false` porque
    # cancelar acá no cancela el build que ya arrancó del otro lado, en Vercel:
    # sólo perdemos de vista que existe.
    concurrency:
      group: deploy-${{ inputs.environment }}-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # La URL va por `env:` y no interpolada en el `run:`. Interpolarla la
      # mete literal en el script que se ejecuta; por `env:` no aparece nunca
      # en el comando. Igual Actions la enmascara en los logs por ser secret,
      # pero eso es la última línea de defensa, no la primera.
      - name: Disparar el Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.deploy_hook_url }}
        run: |
          set -euo pipefail
          # `--fail-with-body` en vez de `--fail`: si Vercel rechaza el pedido
          # queremos leer POR QUÉ, y con `--fail` a secas el cuerpo se descarta.
          # `-o -` manda el cuerpo a stdout; el status va aparte, para no
          # depender de parsear el JSON.
          codigo=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-connrefused --max-time 30 \
            -X POST "$DEPLOY_HOOK_URL" \
            -o respuesta.json -w '%{http_code}') || {
              echo "::error::El Deploy Hook de '${{ inputs.environment }}' rechazó el pedido (HTTP $codigo)."
              cat respuesta.json || true
              exit 1
            }
          echo "Hook aceptado (HTTP $codigo):"
          cat respuesta.json
          echo
          # El hook responde apenas encola el deploy. Que haya respondido 201
          # significa que Vercel aceptó el pedido, NO que el deploy salió bien:
          # el build puede fallar después. Sin un token de Vercel acá no hay
          # forma de esperar el resultado, así que este job no lo afirma.
          echo "::notice::Deploy encolado en Vercel para '${{ inputs.environment }}'. El resultado del build se ve en el dashboard de Vercel, no acá."
