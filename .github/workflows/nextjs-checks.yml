# Verificaciones de una app Next.js. No deploya nada.
#
# Está separado del deploy a propósito. Cuando los dos vivían en el mismo
# workflow, encadenados por `needs`, el deploy heredaba el trigger de los
# checks: si los checks corrían al pushear, el deploy también. Y el objetivo
# era el contrario — que el deploy lo dispare una persona, no un push.
#
# Ver `vercel-deploy-hook.yml` para el deploy.

name: Next.js checks

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path a la app Next.js dentro del repo llamador"
        required: false
        type: string
        default: "."
      node_version:
        description: "Versión de Node. Conviene que coincida con la que usa Vercel para buildear el proyecto, si no el CI puede pasar sobre un build que Vercel rechaza (o al revés)."
        required: false
        type: string
        default: "24"
      pnpm_version:
        required: false
        type: string
        default: "9"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm_version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working_directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ inputs.working_directory }}
      - run: pnpm lint
        working-directory: ${{ inputs.working_directory }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm_version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working_directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ inputs.working_directory }}
      - run: pnpm exec tsc --noEmit
        working-directory: ${{ inputs.working_directory }}

  # El build corre después de lint y typecheck: es el más caro de los tres y
  # casi todo lo que lo rompe lo detectan ellos antes y más rápido.
  #
  # Ojo con el entorno: este job no recibe las env vars del proyecto de Vercel.
  # Si algún módulo se cae al evaluarse sin ellas, el build falla acá aunque
  # en Vercel ande. La salida no es copiar las credenciales a GitHub, es que
  # el módulo no las necesite hasta que alguien lo use.
  build:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm_version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working_directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ inputs.working_directory }}
      - run: pnpm build
        working-directory: ${{ inputs.working_directory }}
